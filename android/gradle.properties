# Keep heap under physical RAM (~7Gi). 8G+4G metaspace OOMs the daemon on this machine.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=384m
android.useAndroidX=true
# Legacy KGP until all Flutter plugins migrate to built-in Kotlin (see patch_plugins_built_in_kotlin.gradle).
android.builtInKotlin=false
android.newDsl=false
