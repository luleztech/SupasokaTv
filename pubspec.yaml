name: supasoka
description: Supasoka — Live TV & movies (Flutter port of StreamZone).
publish_to: "none"

version: 1.1.8+13

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  google_fonts: ^8.1.0
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  share_plus: ^13.1.0
  shared_preferences: ^2.3.3
  ionicons:
    path: packages/ionicons
  video_player: ^2.9.2
  chewie: ^1.11.3
  webview_flutter: ^4.10.0
  uuid: ^4.5.1
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^18.0.1
  audioplayers: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
