name: supatv
description: SupaTV — Android TV & Windows viewer for Supasoka (channels + player only).
publish_to: "none"

version: 1.3.15+39

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  supasoka:
    path: ../
  provider: ^6.1.2
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_android_video: ^1.3.8
  media_kit_libs_windows_video: ^1.0.11
  media_kit_libs_linux: ^1.2.1
  cached_network_image: ^3.4.1
  wakelock_plus: ^1.6.1
  webview_flutter: ^4.14.0
  shared_preferences: ^2.3.3
  shared_preferences_linux: ^2.4.1
  shared_preferences_windows: ^2.4.1
  path_provider_linux: ^2.2.2
  path_provider_windows: ^2.3.0
  http: ^1.2.2
  package_info_plus: ^10.1.0
  audioplayers: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - ../assets/audio/fungua_zote_guide.mp3
